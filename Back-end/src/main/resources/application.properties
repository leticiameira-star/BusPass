spring.application.name=busspass

# Banco de dados
# No Render usa as variaveis de ambiente. No seu PC, usa o valor padrao depois dos dois pontos.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/busspay?serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Servidor
server.port=${PORT:8080}

# Mensagens em UTF-8
server.servlet.encoding.charset=UTF-8